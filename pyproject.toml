[project]
name = "printo"
version = "0.1.0"
description = "Local print-shop backend. Phones upload a file, the shop computer prepares it, and CUPS prints it."
readme = "docs/setup.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "pypdf>=5",
    "pillow>=11",
    "pillow-heif>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
printo = "printo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
