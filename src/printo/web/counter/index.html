<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe6">
  <title>printO</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/c/common.css">
  <link rel="stylesheet" href="/admin/c/counter.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><i aria-hidden="true"></i><span>printO</span></div>
      <p class="printer" id="printer" data-state=""><i class="dot" aria-hidden="true"></i><span>Checking the printer…</span></p>
    </header>
    <div class="main">
      <aside class="queue" id="queue" aria-label="Files"></aside>
      <section class="desk">
        <div class="work">
          <div id="intro"><p class="quiet">One moment…</p></div>
          <div id="controls"></div>
        </div>
        <div id="paper" hidden></div>
      </section>
    </div>
  </div>
  <script src="/admin/c/counter.js"></script>
</body>
</html>
