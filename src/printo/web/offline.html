<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>printO</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #f3efe6; color: #1a1714;
      font-family: "Ubuntu", "Cantarell", "Segoe UI", system-ui, sans-serif;
      letter-spacing: -0.011em;
    }
    main { width: min(28rem, calc(100% - 48px)); }
    i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: #b85a2a; box-shadow: 0 0 0 4px rgba(184, 90, 42, 0.12); margin-right: 10px; }
    .brand { font-weight: 650; margin-bottom: 28px; }
    h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.03em; font-weight: 600; margin: 0 0 12px; }
    p { margin: 0; color: #6b635a; max-width: 36ch; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><i></i>printO</div>
    <h1>The counter isn't available yet.</h1>
    <p>Start the shop on this computer, then open the counter again.</p>
  </main>
</body>
</html>
